; First installation: copy this file to Config.ini, then configure the features you use.
; Existing installation: keep your Config.ini. The ZIP never contains Config.ini.
; All input features start disabled. Settings omitted here use Core/ConfigLoader.ahk defaults.
[Features]
Teleport=0
AltF4Teleport=0
BotWarp=0
Movement=0
AutoClick=0
Timer=0
CasinoFingerprint=0
ClawMachine=0
AntiAFK=0
SessionSwitch=0
MenuMacros=0
Earner=0

[Hotkeys]
