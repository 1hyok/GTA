name: Earn ledger report checks

on:
  push:
    paths:
      - 'tools/earn-ledger-report/**'
      - 'Features/Earn/EarnLedger.ahk'
      - '.github/workflows/earn-ledger-report.yml'
  pull_request:
    paths:
      - 'tools/earn-ledger-report/**'
      - 'Features/Earn/EarnLedger.ahk'
      - '.github/workflows/earn-ledger-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-report:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check offline report behavior
        run: python -m unittest discover -s tools/earn-ledger-report -p 'test_*.py' -v
