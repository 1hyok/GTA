name: Close linked issues

# auto-merge.yml 이 github.token 으로 건 자동 머지는 github-actions 앱 명의로 머지되고, 그 경우
# GitHub 는 PR 본문의 Fixes #N 을 처리하지 않았다(2026-10-08~10-15 머지 PR 70건 대조, 이슈 #320).
# 머지된 PR 이 참조하는 같은 저장소의 열린 이슈를 여기서 닫는다. 사람이 머지해 이미 닫힌 이슈는 건너뛴다.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close open issues the merged pull request references
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          linked=$(gh api graphql \
            -f owner="${REPO%%/*}" -f name="${REPO#*/}" -F pr="$PR_NUMBER" \
            -f query='query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 50) {
                    nodes { number state repository { nameWithOwner } }
                  }
                }
              }
            }' \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | "\(.number)\t\(.state)\t\(.repository.nameWithOwner)"')
          closed=0
          while IFS=$'\t' read -r number state owner_repo; do
            [ -n "$number" ] || continue
            if [ "$state" != "OPEN" ] || [ "$owner_repo" != "$REPO" ]; then
              echo "skip #$number ($state, $owner_repo)"
              continue
            fi
            gh issue close "$number" --repo "$REPO" --reason completed \
              --comment "$PR_URL 가 main 에 머지되어 닫는다. 머지 커밋 $MERGE_SHA"
            echo "closed #$number"
            closed=$((closed + 1))
          done <<< "$linked"
          echo "Linked issues closed by #$PR_NUMBER: $closed" >> "$GITHUB_STEP_SUMMARY"
