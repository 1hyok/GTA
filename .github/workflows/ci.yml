name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
        working-directory: gta checkout
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: gta checkout
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download verified portable AutoHotkey
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'gta-ahk'
          $ahk = & .\tools\ci\install-autohotkey.ps1 -Destination $runtime
          "AHK_PATH=$ahk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run syntax and offline regression checks
        run: |
          & .\tools\ci\run-checks.ps1 -AhkPath $env:AHK_PATH -PythonPath (Get-Command python).Source -OutputDirectory (Join-Path $env:RUNNER_TEMP 'gta-ci-results')
          exit $LASTEXITCODE

      - name: Package verified macro sources
        run: |
          & .\tools\ci\package-macro.ps1 -CheckResults (Join-Path $env:RUNNER_TEMP 'gta-ci-results\results.json') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'gta-package')

      - name: Save check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gta-ci-results/
            ${{ runner.temp }}/gta-ahk/installation.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save macro ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gta-macro-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gta-package/*.zip
            ${{ runner.temp }}/gta-package/*.sha256
          if-no-files-found: error
          retention-days: 14
