[Features]
; Teleport = CEO/MC 재등록 텔레포트(옛 방식). 해체 → 폰 Quick Join → Random·Alone·Yes → 재등록을 칸 수만 세어 눌러, 해체 뒤 눈 감고 누르는 키가 작업 로비에서 나간 적이 있다(0926). 같은 순서를 화면 확인과 함께 F11 앞단(JobWarpQuickJoin)으로 옮겼으니 이것은 꺼 둔다
Teleport=0
AltF4Teleport=1
; 스팀 봇 작텔(BotWarp, F10 두 번). 작업을 시작해 로딩되는 동안 공개 스팀 봇에 Join Game 을 걸어 작업 출발점에 떨어진다. 사용법은 아래 [Settings] BotWarp* 위 주석
BotWarp=1
Movement=1
AutoClick=1
Timer=1
CasinoFingerprint=0
ClawMachine=1
AntiAFK=1
SessionSwitch=1
MenuMacros=1
; 수익 자동화(벙커 보급·DJ 교체·나이트클럽 금고·현장 파견 스케줄러, 아래 [Settings] Earn* 참고)
Earner=1

[Hotkeys]
; 게임 창이 앞일 때만 잡힌다 (Exit 만 전역). 쉼표로 키를 더 붙일 수 있다 (예: ClawLoop=NumpadMult,F4)
; 넘패드 숫자·점은 NumLock 이 꺼져 있어도 같이 잡힌다. F4/F5/Pause 는 수식어 조합(Alt+F4, Ctrl+Shift+F5, Ctrl+Pause)을 통과시킨다.
ClawAttempt=NumpadDiv
ClawLoop=NumpadMult
AntiAFK=F4
InviteOnlySession=F5
Run=F6
AutoClick=F7
WalkCtrl=F8
; 스팀 봇 작텔 (두 번 눌러 실행): 지도에서 작업 블립을 골라 화면 아래 "Start Job (Space)" 가 보일 때 누른다. 따로 실행하는 KeyHoldTest.ahk·LCtrlSpammer.ahk 도 F10 을 쓰니 함께 켜지 않는다
BotWarp=F10
RegisterCEO=Numpad1
RegisterMC=Numpad2
CayoPericoTimer=Numpad3
Snack=Numpad0
Help=NumpadDot
StopAll=End
Exit=Pause
; 아래는 키를 비워 둔 기능. 쓰려면 키 이름을 적는다 (비어 있는 키: ScrollLock)
TeleportMC1=
TeleportMC2=
TeleportAltF4=F11
; 수익 자동화 켜기/끄기 (두 번 눌러 실행)
Earner=F9
Walk=
CasinoFingerprint=

[Settings]
; 클릭 설정
ClickInterval=1
ClickHoldTime=50

; 키 입력 설정
KeyHoldTime=100

; 두 번 눌러야 실행하는 기능(초대 전용 세션·텔레포트)의 두 번째 누름 허용 시간(ms)
ConfirmWindowMs=2000
; 도움말 툴팁이 떠 있는 시간(ms)
HelpShowMs=8000

; 텔레포트·메뉴 설정 (상호작용 메뉴 매크로도 MenuOpenDelay/MenuControlDelay 를 쓴다)
MenuOpenDelay=400
PhoneOpenDelay=1000
MenuControlDelay=120
PhoneControlDelay=150

MCDisbandDelay=1000
PhoneCloseDelay=1000

TeleportWaitTime=38000
TeleportTimerInterval=100

; 새 F4 텔레포트 설정
TeleportEnterDuration=100000
TeleportEnterInterval=50
TeleportClickToEnterDelay=4000
; 작텔(TeleportAltF4, F11 두 번): 작업 시작→확인 간격 / 확인→Alt+F4 간격 / 종료창 No/Yes 안내를 기다리는 최대 시간 / No 를 누르기 전 최소 대기 / 안내 뜬 뒤 여유. 0926 실측: 안내는 약 20초에 뜨지만 32초에 No 는 작업 로비(실패), 60초에 No 는 작업 위치(성공 2회). 최소 대기를 줄이지 말 것
JobWarpStartToConfirmMs=1200
JobWarpConfirmToAltF4Ms=900
JobWarpQuitWaitMs=90000
JobWarpMinWaitMs=60000
JobWarpAfterPromptMs=1500
; F11 두 단계 (Features\Teleport\QuickJoinPrep.ahk). 1 이면 첫 F11 두 번이 보스 해제 → 폰 Quick Join → Random → Alone → Yes → 곧바로 보스 등록까지 하고 "작텔 준비됨" 이 된다.
; 그다음 prep 을 시작하고 지도에서 작업 아이콘에 커서를 올려 F11 두 번이면 위 Alt+F4 작텔. 0 이면 F11 두 번이 바로 Alt+F4 작텔(예전 동작)
; 키마다 선택 줄을 Images\JobWarp\<해상도>\ 템플릿으로 확인하고, 안 보이면 더 누르지 않고 멈춘다. 템플릿을 다 뜨기 전에는 0 으로 둔다
JobWarpQuickJoin=0
; 다시 등록할 보스 종류(CEO 또는 MC) / 준비됨 상태가 풀리는 시간(분) / 해제·등록 뒤 메뉴로 확인하기 전 대기(ms)
JobWarpBossRole=CEO
JobWarpArmMaxMin=30
JobWarpRetireWaitMs=2500
JobWarpRegisterWaitMs=2500
; 스팀 봇 작텔(BotWarp, F10 두 번). 쓰는 법: 지도에서 작업 블립을 골라 화면 아래 "Start Job (Space)" 가 보일 때 두 번 누른다. 도착지는 고른 작업의 출발점이다
; 지도에 작업 블립이 없으면 P → ONLINE → Jobs → Play Job 에서 작업을 골라 CONFIRM 창이 뜬 상태에서 두 번 눌러도 된다
; 흐름: Space → CONFIRM 에 Enter(작업 로딩) → 스팀 그룹 채팅 "CCYXJ差传" 창을 노트북 화면 오른쪽 위로 옮겨 멤버 필터 CCYXJ → 봇 우클릭 → Join Game → GTA 로 돌아와 알림(다른 세션 참가 / 조준 모드 다름 / incompatible assets)마다 Enter → 약 20초 뒤 도착
; 준비: Images\BotWarp\steam\join_game.png(봇 우클릭 메뉴의 Join Game 글자 조각)가 있어야 시작한다. 스팀 채팅 창은 열어 둔다(초대 링크로 자동으로 열려면 open_in_steam.png·join_group_chat.png 도 필요). 노트북 화면 배율 175%, 게임 화면 16:9
; 안전: Esc 는 보내지 않는다. 알림은 노란 로고 폭과 흰 구분선 폭으로 가려 위 순서의 알림에만 Enter 하고, quit 로고(게임 종료·세션 나가기·스토리 모드)에는 아무 키도 보내지 않는다. Join Game 뒤 키보드를 누르면 넘겨받은 것으로 보고 멈춘다. 중단은 End
; 도착한 세션에서 다시 Start Job 을 누르면 "Currently unavailable" 이 뜬다. 매크로가 Backspace 로 닫고 멈추니 초대 전용 세션(F5 두 번)으로 옮긴 뒤 다시 한다
; 참조 이미지 만드는 법·판정 값·좌표 설명은 Features\Teleport\BotWarp.ahk 맨 위, 진행 기록은 %TEMP%\gta-macro.log 의 [botwarp] 줄(알림마다 로고 폭·구분선 폭을 남긴다)
; Space 뒤 CONFIRM 을 기다리는 최대 시간 / 알림을 본 뒤 Enter 까지 / CONFIRM 에 Enter 한 뒤 스팀으로 넘어가기 전 대기 (ms)
BotWarpConfirmTimeoutMs=4000
BotWarpAlertEnterDelayMs=600
BotWarpAfterConfirmMs=1000
; 스팀 클릭 사이 간격 / 멤버 필터를 적은 뒤 목록이 걸러질 때까지 (ms) / 어느 봇에 참가할지 (1: 差传CCYXJ01, 2: 差传CCYXJ03. 이름 이미지 Images\BotWarp\steam\bot1.png·bot2.png 로 찾는다)
BotWarpSteamStepMs=600
BotWarpSteamFilterMs=800
BotWarpBotRow=1
; Join Game 뒤 첫 알림을 기다리는 최대 시간 / 알림에 Enter 할 때마다 다음 알림이나 도착(체력 막대)까지 기다리는 최대 시간 (ms) / Join Game 뒤 Enter 를 보낼 알림 종류 수 상한 (다른 세션 참가 → 조준 모드 → incompatible assets, 이 순서로)
BotWarpJoinAlertTimeoutMs=20000
BotWarpArriveTimeoutMs=90000
BotWarpMaxJoinAlerts=3

; 카요 페리코 쿨타임 설정
CayoCooldownMinutes=48
VellumDrivingCtrlInterval=3000

; 인형 뽑기 설정 - 키 조작은 화면 안내를 확인하며 진행한다
; Forward/Right 는 1920x1080, RT 켬, DLSS 품질/FG 2X, 프레임 제한 120에서 집게 위치를 확인한 값
ClawForwardMs=5000
ClawRightMs=5000
ClawEnterTimeout=15000
ClawResultTimeout=30000

; 세션 이동 메뉴 조작 간격
SessionMenuDelay=600

; AFK 방지 - 이 시간 동안 사용자 입력이 없을 때만 누른다 / 누르는 간격과 흔들림 / 누르는 길이와 사이 간격 / 매크로 시작 시 켤지
AFKUserIdleSec=45
AFKIntervalSec=200
AFKJitterSec=20
AFKTapMs=150
AFKGapMs=250
AFKOnStart=1

; 게임 화면 위 상태 표시(오버레이) - 켤지 / 오른쪽 끝의 가로 위치(%) / 위쪽 끝의 세로 위치(%). 작텔 종료창 안내 감지(오른쪽 아래 구석)·인형 뽑기 안내 검색(왼쪽 위)·화면 가운데를 덮는 위치면 기본 위치(98, 18)로 되돌린다
OverlayEnabled=1
OverlayXPct=98
OverlayYPct=18

; 상호작용 메뉴 매크로 - 메뉴 맨 위(Quick GPS)에서 센 Down 횟수. 게임 버전·보유 자산·집 안 여부로 달라지면 여기만 고친다
; 내 부동산(아케이드·에이전시 등) 안에서는 맨 위에 '… Management' 줄이 한 줄 더 붙는다. 안이면 1, 밖이면 0 (0926 아케이드 실측: 안 1)
MenuTopOffset=1
; 스낵: M → Down x SnackMenuSteps (Health and Ammo) → Enter → Down x SnackSubSteps (Snacks) → Enter → Down x SnackItemSteps → Enter x SnackCount → M
SnackMenuSteps=4
SnackSubSteps=2
SnackItemSteps=0
SnackCount=1
SnackCloseMenu=1
; CEO 등록: M → Down x CEOMenuSteps (Register as a Boss) → Enter → Down x CEOSubSteps (SecuroServ CEO) → Enter x CEOEnterCount
; 등록이 끝나면 게임이 메뉴를 스스로 닫으므로 CloseMenu=0 (1 이면 M 이 메뉴를 다시 연다, 0926 실측)
CEOMenuSteps=1
CEOSubSteps=0
CEOEnterCount=2
CEOCloseMenu=0
; MC 등록: M → Down x MCMenuSteps (Register as a Boss) → Enter → Down x MCSubSteps (Motorcycle Club President) → Enter x MCEnterCount
MCMenuSteps=1
MCSubSteps=1
MCEnterCount=2
MCCloseMenu=0

; === 수익 자동화 (Earner, F9 두 번으로 켜고 끔, End 로 멈춤) ===
; 거점: 아케이드 지하 마스터 컨트롤 터미널(MCT) 앞. 켜기 전에 CEO·MC 는 해제 상태로 두고, 캐릭터를 MCT 앞("Press E to sit down" 안내가 보이는 자리)에 세운다.
; 켜 두면 5초마다 할 일을 보고 때가 된 것 하나를 끝까지 한다. 사용자가 EarnUserIdleSec 초 안에 키보드·마우스를 만졌으면 시작하지 않는다.
; 모든 단계는 화면(템플릿 Images\Earn\1920x1080)으로 확인한 뒤 다음 키를 누른다. 확인이 안 되면 자동화를 끄고 AFK 방지는 켜 둔다. 까닭은 %TEMP%\gta-earn.log
; 부동산 사이 이동은 상호작용 메뉴의 스폰 위치를 바꾸고 초대 전용 세션으로 다시 들어가는 방식이다. 스폰 자리가 매번 달라 목표까지 미니맵 길이 보이는 자리가 나올 때까지 다시 들어간다
; 키 사이 간격(ms) / 카메라 1도에 해당하는 마우스 이동량 / 목표 블립까지 길이 보이는 자리를 찾을 때 다시 들어가는 최대 횟수 / 길이 보인다고 칠 거리(미니맵 px)
EarnKeyDelay=350
EarnTurnUnitsPerDeg=29
EarnRerollMax=12
EarnReachPx=14
; 부동산 안에 들어간 뒤 걸어서 목표 블립에 못 닿으면 다시 들어가 보는 횟수
EarnWalkRetry=3
; 사용자 입력이 없어야 하는 시간(초) / 재접속 뒤 최소 대기(초) / 재접속 뒤 게임 화면이 돌아오기를 기다리는 최대 시간(초)
EarnUserIdleSec=45
EarnLoadMinSec=8
EarnLoadTimeoutSec=240
; 나이트클럽 금고: 켤지 / 간격(분). 인기도 95% 이상이면 48분마다 $50,000, 상한 $250,000(약 4시간)이라 3시간 반 간격 / 켠 뒤 첫 방문까지(분)
EarnSafe=1
EarnSafeIntervalMin=210
EarnSafeFirstMin=0
; 길을 못 찾거나 재접속 자리가 나빠 못 갔을 때 몇 분 뒤 다시 할지 / 연속 몇 번 못 하면 자동화를 끌지
EarnSafeRetryMin=15
EarnSoftFailMax=12
; 1: 사용자가 열어 둔 MCT에서만 작업. 금고 방문·파견·세션 이동 없이 현재 화면 유지.
EarnMCTOnly=1
; 벙커 보급: 켤지 / 기본 간격(초). MCT 전용 모드는 가속 생산을 놓치지 않도록 최대 5분마다 상태 확인.
EarnBunker=1
EarnBunkerIntervalSec=1645
; 나이트클럽 DJ 교체: 켤지 / 상태 확인 간격(분) / 이 값(%) 미만이면 교체.
EarnDJ=1
EarnDJIntervalMin=5
EarnDJPopularityPct=95
; 현장 파견: 켤지 / 간격(분) / 켠 뒤 첫 파견까지(분)
EarnDispatch=0
EarnDispatchIntervalMin=48
EarnDispatchFirstMin=0
